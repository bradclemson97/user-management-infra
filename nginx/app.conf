server {
    listen 80;
    server_name app.bradleyclemson.com;
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl;
    server_name app.bradleyclemson.com;

    ssl_certificate     /etc/letsencrypt/live/app.bradleyclemson.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.bradleyclemson.com/privkey.pem;
    include             /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

    # Increase buffer sizes for Keycloak token responses
    proxy_buffer_size   128k;
    proxy_buffers       4 256k;
    proxy_busy_buffers_size 256k;

    # Common proxy headers
    proxy_set_header Host              $host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # Keycloak: realms, admin, static resources
    location ~ ^/(realms|admin|resources|js|welcome)(/|$) {
        proxy_pass http://127.0.0.1:9000;
    }

    # User Management UI
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
